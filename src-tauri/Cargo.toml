[package]
name = "win-optimizer"
version = "0.1.0"
description = "Windows Optimization App"
authors = ["Dương"]
edition = "2021"

[lib]
name = "win_optimizer_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["custom-protocol"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
chrono = "0.4"
tauri-plugin-shell = "2"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
] }
winreg = "0.56.0"
futures = "0.3.34"
# lhm-sys = "0.1.1"  # Temporarily disabled to debug E0255

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
